 INFP:['🧸','소아청소년과','작은 마음까지 헤아리는 공감 닥터',["당신을 의학 드라마 속 인물로 그린다면, 아이에게 바로 질문하기보다 손에 든 인형 이름부터 물어보는 선생님일 것 같아요. 말의 내용만큼 표정과 분위기도 살피고, 상대가 편해질 때까지 자기 속도를 조금 늦춰주는 캐릭터죠.", "당신의 진료실에서는 작은 용기도 그냥 지나가지 않을 듯해요. 씩씩하게 인사한 아이에게는 엄지를, 지친 보호자에게는 따뜻한 한마디를 건네는 장면이 떠오릅니다. 아이가 지난번에 좋아한다고 했던 공룡을 기억해뒀다가 슬쩍 꺼내는 반전 기억력도 있을 것 같고요.", "동료들은 당신을 “조용한데 은근히 사람을 잘 챙기는 선생님”으로 기억할지도 몰라요. 다만 하루가 끝난 뒤에도 “아까 그 아이는 괜찮을까?” 하며 혼자 장면을 되감기할 수 있겠네요. 오늘 충분히 마음을 썼다면, 퇴근 뒤에는 내 마음도 챙겨주는 엔딩이 어울립니다."]],
 INFJ:['🌿','정신건강의학과','마음의 이야기를 듣는 닥터',["당신은 대화가 끝난 뒤에도 상대가 잠깐 멈췄던 순간을 기억하는 캐릭터 같아요. “괜찮아요”라는 말 뒤에 어떤 이야기가 있을지 궁금해하고, 바로 결론을 내리기보다 그 사람만의 맥락을 알아가는 과정에 끌릴 듯합니다.", "상상 속 진료실에서는 질문을 쏟아내기보다 상대가 자기 말을 찾을 시간을 줄 것 같아요. 처음에는 짧게 대답하던 사람이 어느새 긴 이야기를 꺼내고, 당신은 앞서 나온 말을 연결해 조심스럽게 되짚어주는 장면이 떠오릅니다. 화려한 한마디보다 오래 남는 대화가 당신의 매력이겠죠.", "동료에게도 속마음을 털어놓고 싶은 사람으로 보일 수 있어요. 반면 남의 고민을 내 숙제처럼 품으면 머릿속 회의가 밤까지 이어질지도! 모두의 이야기에 완벽한 답을 줄 필요는 없어요. 가끔은 조용히 함께 있어주는 역할만으로도 캐릭터의 존재감은 충분합니다."]],
 ENFP:['🌈','가정의학과','동네의 에너지를 채우는 닥터',["당신의 진료실에는 사람마다 다른 이야기가 모일 것 같아요. 처음 보는 사람에게도 대화의 실마리를 잘 찾고, 사소한 근황에서 새로운 궁금증이 생기는 캐릭터죠. 병원에 들어올 때보다 나갈 때 표정이 조금 풀리는 장면이 잘 어울립니다.", "진료 중 나온 일상 이야기도 허투루 듣지 않을 듯해요. “지난번에 말씀하신 여행은 다녀오셨어요?” 하고 묻는 한마디에 상대가 반가워하는 모습이 떠오릅니다. 이런 친근한 이미지를, 다양한 고민을 만나는 가정의학과 캐릭터와 연결해봤어요.", "동료들과는 재미있는 일을 벌이는 아이디어 담당일지도 몰라요. 환영회부터 안내문 문구까지 당신 손을 거치면 분위기가 한결 부드러워질 듯하죠. 다만 재미있는 이야기를 따라가다 보면 하려던 일을 잠깐 잊을 수도! 좋은 생각을 짧게 메모해두면 특유의 에너지를 끝까지 이어가기 좋겠네요."]],
 ENFJ:['🤝','재활의학과','함께 한 걸음씩 나아가는 닥터',["당신은 누군가의 작은 변화에 먼저 박수를 보내는 캐릭터 같아요. 결과만 보는 것보다 여기까지 오는 동안 얼마나 애썼는지 알아주는 쪽이죠. “지난번보다 편해 보이세요” 같은 말이 자연스럽게 나오는 장면이 떠오릅니다.", "상상 속 재활의학과 진료실에서는 목표를 함께 세우고, 과정에서 생기는 답답함도 들어줄 것 같아요. 상대가 의욕을 잃은 날에는 무작정 힘내라고 하기보다 지금 할 수 있는 작은 한 걸음을 같이 찾는 모습이 어울립니다. 당신에게는 함께 나아간다는 느낌이 꽤 중요할지도요.", "팀에서는 각자의 노력을 알아주고 분위기를 이어주는 역할일 듯해요. 누구 하나 뒤처져 있으면 슬쩍 곁으로 가는 스타일이랄까요. 다만 모두를 응원하다가 내 배터리가 바닥난 건 늦게 알아챌 수 있어요. 오늘의 마지막 응원 한마디는 자신에게 남겨둬도 좋겠습니다."]],
 INTJ:['🧩','영상의학과','단서를 연결하는 전략가 닥터',["당신의 드라마 속 등장 장면은 조용하지만 인상적일 것 같아요. 다른 사람들이 흩어진 이야기를 나누는 동안, 혼자 단서들을 연결하다가 “이 부분도 같이 보면 어떨까요?”라고 말하는 캐릭터죠. 복잡한 내용에서 흐름을 찾는 이미지가 어울립니다.", "영상의학과라는 결과에는 눈에 띄는 한 장면보다 전체 맥락을 살피는 탐정 같은 분위기를 담았어요. 화면을 들여다보는 차분한 모습과, 정리된 생각을 필요한 말로 전하는 장면이 떠오릅니다. 머릿속에는 이미 여러 갈래의 지도가 그려져 있을지도 모르겠네요.", "동료들은 당신의 짧은 설명 뒤에 꽤 긴 생각이 있다는 걸 알게 될 것 같아요. 다만 머릿속에서 너무 많은 단계를 건너뛰면 듣는 사람은 “잠깐, 거기까지 어떻게 갔어요?” 할 수도 있죠. 연결고리를 하나씩 풀어줄 때 당신의 매력이 더 잘 전해지는 캐릭터입니다."]],
 INTP:['🔬','병리과','궁금증을 끝까지 파고드는 닥터',["당신에게 가장 위험한 말은 “그냥 그런가 보다”일지도 몰라요. 작은 의문이 생기면 이유를 찾아보고 싶고, 설명 하나를 알면 질문 두 개가 더 생기는 캐릭터죠. 호기심이 켜진 순간 주변 소리가 잠시 작아지는 장면이 잘 어울립니다.", "병리과라는 결과에는 작은 단서에서 큰 이야기를 찾아가는 탐구자의 이미지를 담았어요. 남들은 지나칠 법한 차이를 붙잡고 “이건 왜 다르지?” 하며 들여다보는 모습이 떠오릅니다. 이 테스트에서는 그런 깊은 몰입을 당신의 의사 캐릭터로 상상해봤습니다.", "평소엔 조용하다가 관심 있는 이야기가 나오면 갑자기 설명이 길어지는 반전도 있을 듯해요. 동료들은 “물어보면 진짜 열심히 알려주는 사람”이라고 느낄 수 있겠죠. 다만 질문의 가지가 너무 많아지면 원래 뭘 찾고 있었는지 잊을 수도! 오늘의 궁금증 하나를 마무리하는 장면도 잘 어울려요."]],
 ENTJ:['🎯','외과','결정의 순간을 이끄는 닥터',["당신은 상황이 복잡해질수록 “그래서 지금 무엇부터 할까요?”라는 말이 떠오르는 캐릭터 같아요. 목표가 보이면 일을 나누고 다음 순서를 잡으며, 여러 사람의 움직임을 한 방향으로 모으는 장면이 어울립니다.", "상상 속 외과 팀에서는 긴 이야기 뒤에 핵심을 정리해주는 역할일 듯해요. 다 같이 준비할 것을 확인하고, 결정한 일은 끝까지 챙기는 모습이 떠오릅니다. 멋진 대사 한 줄보다 팀이 실제로 움직이기 시작하는 순간에 존재감이 드러나는 캐릭터죠.", "동료에게는 든든한 추진력을 가진 사람으로 보일 수 있어요. 다만 내 머릿속 속도가 너무 빠르면 주변에서는 아직 신발 끈을 묶고 있을지도 모릅니다. “다들 어떻게 생각해요?” 하고 한 번 기다려주는 장면이 들어가면, 추진력에 여유까지 갖춘 주인공이 되겠네요."]],
 ENTP:['💡','응급의학과','예상 밖 상황에 아이디어가 켜지는 닥터',["당신은 예상과 다른 일이 생겼을 때 새로운 생각이 켜지는 캐릭터 같아요. 익숙한 방법만 반복하기보다 다른 관점도 떠올리고, 동료와 말을 주고받으며 아이디어를 발전시키는 장면이 어울립니다.", "응급의학과라는 결과에는 계속 새로운 장면을 만나는 드라마의 속도감을 담았어요. 여기서는 실제 판단 능력을 평가한 것이 아니라, 변화가 있는 환경에서 호기심이 살아나는 캐릭터를 상상했습니다. “이쪽에서도 한번 생각해보면?”이라는 대사와 함께 등장할 것 같네요.", "팀에서는 막힌 대화에 새 관점을 보태는 역할일 듯해요. 함께 이야기하다 보면 예상 못 한 연결이 생겨 동료들도 흥미를 느낄 수 있죠. 다만 아이디어 열 개를 동시에 꺼내면 모두 잠깐 멈출지도! 그중 지금 쓸 한 가지를 골라 마무리할 때 캐릭터가 더 선명해집니다."]],
 ISFJ:['🍀','내과','차곡차곡 신뢰를 쌓는 닥터',["당신은 특별한 이벤트보다 꾸준한 관심으로 기억되는 캐릭터 같아요. 전에 나눴던 이야기나 사소한 불편을 기억해뒀다가 자연스럽게 다시 묻는 모습이죠. 상대는 “내 이야기를 기억하고 있었네” 하는 순간에 당신을 더 편하게 느낄 듯합니다.", "내과라는 결과에는 여러 번의 만남 속에서 차근차근 신뢰를 쌓는 이미지를 담았어요. 상상 속 진료실에서는 지난번 이야기를 꺼내고, 오늘 달라진 점을 함께 살피는 장면이 떠오릅니다. 요란한 표현 없이도 세심함이 전해지는 캐릭터입니다.", "동료에게는 부탁한 일을 잊지 않고 챙기는 든든한 사람으로 보일 수 있어요. 대신 누군가 바빠 보이면 내 일이 끝나지 않았어도 도와주고 싶을지도 모르겠네요. 챙김에도 체력이 필요하니까, 때로는 “이것부터 마치고 도와줄게요”라고 말하는 장면도 당신답게 따뜻할 수 있어요."]],
 ISTJ:['👁️','안과','꼼꼼하게 살피는 원칙파 닥터',["당신은 작은 확인을 귀찮아하지 않는 캐릭터 같아요. 한 번 정한 기준을 차근차근 따라가고, 마무리하기 전에 빠진 것이 없는지 살피는 모습이죠. 남들이 보기에는 조용한 과정이지만 당신에게는 일을 완성하는 중요한 한 부분일 듯합니다.", "안과라는 결과에는 세밀한 차이에 집중하는 이미지를 담았어요. 상상 속 진료실에서는 설명할 내용을 순서대로 짚고, 상대가 놓친 부분은 다시 차분히 알려주는 모습이 떠오릅니다. 한 번의 화려한 장면보다 매일 비슷하게 믿음직한 캐릭터에 가깝습니다.", "동료들은 “이 일은 맡기면 정리가 되어 돌아온다”고 느낄 수 있어요. 반면 갑자기 일정이 바뀌면 겉으로는 평온해도 속으로는 계획표를 다시 펼칠지도 모르죠. 모든 변화까지 미리 정해둘 수는 없으니, 작은 여백을 남겨두면 당신의 꼼꼼함도 더 편하게 빛날 것 같아요."]],
 ESFJ:['💐','산부인과','중요한 순간에 곁을 지키는 닥터',["당신은 새로운 공간에 들어온 사람이 어색해하는 걸 그냥 지나치지 못하는 캐릭터 같아요. 먼저 말을 건네고 필요한 것을 챙기며, 상대가 이 자리에 편하게 머물 수 있도록 분위기를 만드는 장면이 어울립니다.", "산부인과라는 결과에는 중요한 순간에 곁을 지키는 따뜻한 이미지를 담았어요. 상상 속 진료실에서는 말하기 어려워 보이는 질문에도 충분히 시간을 주고, 혼자 고민하던 마음을 조금 내려놓게 하는 모습이 떠오릅니다. 반가운 인사와 차분한 배려가 함께 있는 캐릭터죠.", "동료들의 생일이나 바쁜 일정까지 은근히 기억하고 있을 것 같아요. 팀에서는 누군가 소외되지 않게 자연스럽게 자리를 내주는 역할일지도요. 다만 모두의 기분을 챙기느라 내 기분은 나중으로 미룰 수 있겠네요. 가끔은 챙김을 받는 쪽에 앉아도 충분히 잘 어울립니다."]],
 ESTJ:['🦴','정형외과','차근차근 실행하는 든든한 닥터',["당신은 이야기를 듣다 보면 머릿속에 할 일 목록이 생기는 캐릭터 같아요. 목표가 정해지면 필요한 준비와 순서를 떠올리고, 하나씩 끝내면서 마음이 편해지는 모습이죠. 막연했던 일이 구체적으로 바뀌는 순간에 재미를 느낄 듯합니다.", "정형외과라는 결과에는 행동과 실행을 중시하는 이미지를 담았어요. 상상 속 팀에서는 준비물을 확인하고 역할을 나누며, 지금 어디까지 진행됐는지 살피는 장면이 떠오릅니다. 말로만 끝내지 않고 다음 장면까지 이어가는 캐릭터입니다.", "동료에게는 일이 쌓였을 때 믿고 의논할 수 있는 사람으로 보일 것 같아요. 다만 정리가 덜 된 이야기를 들으면 해결책이 너무 빨리 튀어나올지도! 상대가 오늘은 답보다 공감을 원한다는 걸 알아채면, 든든함에 다정함까지 더해지는 반전 캐릭터가 되겠네요."]],
 ISFP:['🎨','피부과','섬세한 감각을 가진 닥터',["당신은 누군가에게는 사소한 차이가 다른 사람에게는 큰 고민일 수 있다는 걸 살피는 캐릭터 같아요. 내 취향을 앞세우기보다 상대가 무엇을 편하게 느끼는지 알아보는 모습이죠. 조용하지만 자기만의 섬세한 감각이 드러날 듯합니다.", "피부과라는 결과에는 눈에 보이는 작은 변화와 개인의 느낌에 관심을 기울이는 이미지를 담았어요. 상상 속 진료실에서는 먼저 고민을 듣고, 어려운 말을 일상적인 표현으로 풀어주는 장면이 떠오릅니다. 상대가 자기 이야기를 눈치 보지 않고 꺼낼 수 있는 분위기가 당신의 매력이겠네요.", "팀에서는 요란하게 나서지 않아도 공간이나 분위기를 편안하게 만드는 역할일 듯해요. 다만 마음에 들지 않는 부분이 있어도 굳이 말하지 않고 혼자 넘길 수 있겠죠. 당신만 알아챈 차이가 모두에게 도움이 될 때도 있으니, 가끔은 “저는 이렇게 느꼈어요”라고 꺼내봐도 좋겠습니다."]],

 if(!ARCHIVE_ENDPOINT||!archiveConsent)return;
 if(!responseId)responseId=crypto.randomUUID();
 const id=responseId,revision=++saveRevision;
 const payload={responseId:id,surveyVersion:SURVEY_VERSION,gender:profile.gender,ageGroup:profile.age,answers:[...answers],consent:true};
 const status=()=>revision===saveRevision&&id===responseId?document.getElementById('archive-status'):null;
 if(status())status().textContent='응답 저장 중…';
 // 답변을 고친 뒤 재전송해도 한 설문은 한 행만 사용합니다.
 saveQueue=saveQueue.catch(()=>{}).then(async()=>{
  try{
   const response=await fetch(ARCHIVE_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:AbortSignal.timeout(12000)});
   if(!response.ok)throw new Error('Save failed');
   const confirmation=await response.json();if(confirmation.saved!==true)throw new Error('Save failed');
   if(status())status().textContent='응답이 저장됐어요.';
  }catch{
   const node=status();if(node){node.textContent='응답을 저장하지 못했어요. 결과 보기와 공유는 계속 이용할 수 있어요. ';const retry=document.createElement('button');retry.className='back';retry.textContent='저장 다시 시도';retry.onclick=()=>saveResponse();node.append(retry);}
  }
 });
}

async function loadUsage(shared){
 const revision=++usageRequest;
 try{
  if(location.protocol==='file:')throw new Error('Preview');
  if(!shared&&!usageId)usageId=crypto.randomUUID();
  const response=await fetch(USAGE_ENDPOINT,{method:shared?'GET':'POST',...(shared?{}:{headers:{'Content-Type':'application/json'},body:JSON.stringify({completionId:usageId})}),signal:AbortSignal.timeout(10000)});
  if(!response.ok)throw new Error('Unavailable');
  const data=await response.json();
  if(!Number.isSafeInteger(data.total)||!Number.isSafeInteger(data.today)||data.total<0||data.today<0||data.today>data.total)throw new Error('Invalid counts');
  if(revision!==usageRequest||!document.getElementById('usage-total'))return;
  document.getElementById('usage-total').textContent=data.total.toLocaleString('ko-KR');
  document.getElementById('usage-today').textContent=data.today.toLocaleString('ko-KR');
  document.getElementById('usage-status').textContent='';
 }catch{
  if(revision===usageRequest&&document.getElementById('usage-status'))document.getElementById('usage-status').textContent='집계 준비 중';
 }
}

function calculate(){
 const mbti=Object.fromEntries([...'EISNTFJP'].map(k=>[k,0]));
 const scores=Object.fromEntries(Object.keys(traits).map(k=>[k,0]));
 const selected=questions.map((q,i)=>q.options[answers[i]]);
 if(selected.some(option=>!option))throw new Error('모든 질문에 답해주세요.');
 selected.forEach(option=>{for(const [key,value] of Object.entries(option.mbti))mbti[key]+=value;scores[option.trait]++;});
 // 동점은 해당 성향에 처음 점수를 준 답변으로 결정합니다.
 const type=['EI','SN','TF','JP'].map(([a,b])=>{
  if(mbti[a]!==mbti[b])return mbti[a]>mbti[b]?a:b;
  const first=selected.find(o=>(o.mbti[a]||0)!==(o.mbti[b]||0));
  return (first.mbti[a]||0)>(first.mbti[b]||0)?a:b;
 }).join('');
 const [first,second]=routes[type];
 const winner=scores[second[1]]>scores[first[1]]?second:first;
 return {type,key:winner[0],trait:winner[1],scores};
}
function result(shared=false){

 const {type,key,trait}=currentResult,r=results[key];
 const cardNumber=Object.entries(routes).flatMap(([t,options])=>options.map(([k])=>({type:t,key:k}))).findIndex(v=>v.type===type&&v.key===key)+1;
 const tags={care:['마음 먼저','다정한 한마디'],analysis:['호기심 가득','디테일 발견'],plan:['차근차근','든든한 존재'],action:['현장에 진심','일단 해보자']}[trait];
 show(`<div class="result-layout"><section class="doctor-card" data-trait="${trait}" aria-label="진료과 결과 카드"><div class="card-topline"><span>DOCTOR TYPE</span><span class="card-stamp">MY DOCTOR CARD</span></div><div class="character-stage" aria-hidden="true"><span class="spark one">✧</span><div class="character-disc"><img src="assets/characters/${specialtyCharacters[r[1]]}.webp" alt="" width="240" height="240" decoding="async"></div><span class="spark two">✦</span></div><div class="eyebrow">${shared?'친구에게 어울리는 진료과는':'나에게 어울리는 진료과는'}</div><h1>${r[1]}</h1><p class="nickname">${r[2]}</p><div class="card-tags">${tags.map(tag=>`<span>#${tag}</span>`).join('')}</div><div class="card-bottomline"><span>Dr. JP의 닥터 도감</span><span>No. ${String(cardNumber).padStart(2,'0')} · 재미로 보는 결과</span></div></section><div class="share-area"><button id="share-button" class="primary" onclick="shareResult()">친구한테 내 카드 공유하기 ↗</button><p>친구는 어떤 과일까? 우리 결과를 비교해봐요.</p><p id="share-status" role="status" aria-live="polite"></p><textarea id="share-copy" aria-label="공유할 내용" readonly hidden style="width:100%;min-height:120px;padding:12px;font:inherit;border:1px solid #dfe7dc;border-radius:12px"></textarea></div><section class="story-card"><h2>이런 의사 캐릭터, 바로 당신!</h2>${r[3].map((paragraph,i)=>`<div class="story-block"><h3>${['🌱 나를 닮은 성향','🩺 진료실 속 나의 모습','💬 동료가 보는 나'][i]}</h3><p>${paragraph}</p></div>`).join('')}<p class="fine">재미로 연결한 의사 캐릭터예요.<br>실제 적성이나 진로를 판단하는 근거가 아닙니다.</p></section>${shared?'':optionalProfile()}<div class="result-actions"><button class="primary secondary" onclick="restart()">${shared?'나도 내 진료과 알아보기 →':'다시 해보기 ↻'}</button>${shared?'':'<button class="back" onclick="step=11;question()">← 마지막 답변 바꾸기</button>'}</div>${usageFooter()}</div>`);
 loadUsage(shared);
 if(!shared)bindOptionalProfile();
}

function shareData(){
 const {type,key}=currentResult;
 const text=`내 닥터 타입은 ${results[key][1]}! 🩺 너는 어떤 과가 나올까? 12문항으로 알아보자. (재미용 테스트)`;
 const local=location.protocol==='file:'||/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname);
 if(local)return {title:'닥터 타입 — 나에게 어울리는 진료과',text,local:true};
 const url=new URL(location.href);url.search='';const id=Object.entries(routes).flatMap(([t,options])=>options.map(([k])=>({type:t,key:k}))).findIndex(r=>r.type===type&&r.key===key);url.hash=new URLSearchParams({result:String(id+1)}).toString();
 return {title:'닥터 타입 — 나에게 어울리는 진료과',text,url:url.href,local:false};
}
async function shareResult(){
 const button=document.getElementById('share-button'),status=document.getElementById('share-status'),box=document.getElementById('share-copy');
 const {local,...data}=shareData();
 const content=data.text+(data.url?'\n'+data.url:'');
 button.disabled=true;box.hidden=true;
 try{
  if(!local&&navigator.share){
   try{await navigator.share(data);status.textContent='공유 창으로 전달했어요.';return;}
   catch(error){if(error.name==='AbortError'){status.textContent='공유를 취소했어요.';return;}}
  }
  try{
   if(!navigator.clipboard?.writeText)throw new Error('Clipboard unavailable');
   await navigator.clipboard.writeText(content);
   status.textContent=local?'결과 문구를 복사했어요. 친구가 접속할 링크는 사이트 공개 후 함께 포함됩니다.':'결과와 링크를 복사했어요. 친구에게 붙여넣어 보내세요!';
  }catch{
   box.hidden=false;box.value=content;box.focus();box.select();
   status.textContent=local?'아래 결과 문구를 직접 복사해주세요. 친구가 접속할 링크는 사이트 공개 후 포함됩니다.':'자동 복사가 어려워요. 아래 결과와 링크를 직접 복사해주세요.';
  }
 }finally{button.disabled=false;}
}
function openSharedResult(){
 const params=new URLSearchParams(location.hash.slice(1));
 let type=params.get('type'),key=params.get('key');
 if(params.has('result')){
  const id=params.get('result');
  if(!/^(?:[1-9]|[12][0-9]|3[0-2])$/.test(id))return false;
  const entry=Object.entries(routes).flatMap(([t,options])=>options.map(([k])=>({type:t,key:k})))[Number(id)-1];
  type=entry.type;key=entry.key;
 }
 if(!Object.hasOwn(routes,type))return false;
 const route=routes[type].find(([candidate])=>candidate===key);
 if(!route)return false;
 currentResult={type,key,trait:route[1]};result(true);return true;
}
function restart(){usageId=null;usageRequest++;archiveConsent=false;responseId=null;saveRevision++;answers=[];profile={gender:'',age:''};step=0;currentResult=null;if(location.hash)history.replaceState(null,'',location.pathname+location.search);home();}
window.addEventListener('hashchange',()=>{if(!openSharedResult())home();});
if(!openSharedResult())home();
</script>
